name: jalmitra
description: "JalMitra - Your Pocket Water Saver. Zero-hardware, zero-cost, fully offline water conservation Android app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.2
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  fl_chart: ^0.70.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
